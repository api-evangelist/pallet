aid: pallet
name: Pallet
description: 'Pallet builds an AI-powered logistics workforce: autonomous AI agents
  that automate supply chain operations for freight brokerages, freight forwarders,
  FTL and LTL carriers, warehouses, and shippers. Its agents handle end-to-end workflows
  from quoting through order entry, track-and-trace, billing, and customer service,
  integrating with existing TMS, WMS, email, and legacy applications. The Atlas product
  surfaces revenue opportunities across freight operations. Pallet is backed by Bain
  Capital Ventures and General Catalyst. No public developer API, SDK, or documentation
  surface was found during enrichment.'
